[project]
name = "tenebris-ai-sentinel"
version = "0.1.0"
description = "Servicio de prediccion en tiempo real (GRU dual) para cuarto de cria de tenebrios."
readme = "../docs/ai-predictor.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "joblib>=1.5.3",
    "langchain-anthropic>=1.4.0",
    "langchain-openai>=1.1.13",
    "langgraph>=1.1.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.2",
    "playwright>=1.40",
    "pypdfium2>=4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.26",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0",
    "sse-starlette>=3.3.4",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Empaquetar SOLO el modulo `app`. La carpeta `models/` contiene assets
# binarios (.keras, .save) que viajan via runtime via Path, no como package.
[tool.setuptools]
packages = ["app"]
